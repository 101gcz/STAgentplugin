<!-- ============================================================
     四号预设Agent插件 — 酒馆扩展设置区入口卡片
     ============================================================
     这里刻意只放「入口」和几个最常用的开关，完整设置全部在悬浮窗里。
     理由（v3.0 的实际教训）：
       同一份配置摆在两个地方，界面就会互相打架，而且用户在扩展设置区
       里改完、回到悬浮窗看到的是旧值，会以为插件坏了。
       现在配置只有一套控件 —— 悬浮窗。

     这个文件由 index.js 通过 renderExtensionTemplateAsync 载入，
     再挂到 #extensions_settings2，所以样式统一放 style.css，
     这里不写 <style>。
     ============================================================ -->

<div id="dro-settings" class="dro-settings">

    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>四号预设Agent插件</b>
            <span id="dro-card-status" class="dro-badge idle">待命</span>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>

        <div class="inline-drawer-content">

            <div class="dro-hint">
                双请求大纲：先用便宜模型读全量聊天记录（过正则压缩）生成剧情大纲，
                再把大纲注入本次请求，交给贵模型写正文。
                <strong>完整设置（调用方式、模型、思维链、白名单、日志）都在悬浮窗里。</strong>
            </div>

            <label class="checkbox_label" for="dro-card-enabled">
                <input type="checkbox" id="dro-card-enabled">
                <span>启用双请求大纲</span>
            </label>

            <label class="checkbox_label" for="dro-card-showbar">
                <input type="checkbox" id="dro-card-showbar">
                <span>显示悬浮竖条</span>
            </label>

            <div class="dro-btnrow">
                <div class="menu_button dro-card-btn" id="dro-card-open">打开悬浮窗</div>
            </div>

            <div class="dro-hint" id="dro-card-caps">自检中…</div>

            <div class="dro-hint">
                悬浮竖条：点一下展开 / 收起，拖动可移动，位置和尺寸都记得住。
                快捷键 <code>Ctrl+Alt+O</code>（Mac 是 <code>Cmd+Alt+O</code>）。
                控制台入口 <code>window.__dro</code>。
            </div>

            <div class="dro-hint">
                版本 <span id="dro-card-version">—</span>
            </div>

        </div>
    </div>
</div>
